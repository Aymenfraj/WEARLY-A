name: Build APK
on:
  push:
    branches: [main, master]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-24.04
    env:
      KS_PASS: ${{ secrets.KS_PASS }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASS: ${{ secrets.KEY_PASS }}
      RUN_NUMBER: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v5
      
      - uses: actions/setup-node@v5
        with: 
          node-version: 20
          cache: 'npm'
          
      - uses: actions/setup-java@v5
        with: 
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: npm install

      - name: Build web assets
        run: node scripts/build-www.js

      - name: Add Android platform
        run: npx cap add android

      - name: Clé de signature
        if: ${{ env.KS_PASS != '' }}
        run: echo "${{ secrets.KS_BASE64 }}" | base64 -d > android/app/release.jks

      - name: Patch Android configuration
        run: python3 scripts/patch_android.py

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build Release (APK + AAB)
        if: ${{ env.KS_PASS != '' }}
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease bundleRelease --no-daemon

      - name: Build Debug (Test APK)
        if: ${{ env.KS_PASS == '' }}
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: WEARLY
          path: |
            android/app/build/outputs/apk/release/app-release.apk
            android/app/build/outputs/bundle/release/app-release.aab
            android/app/build/outputs/apk/debug/app-debug.apk
