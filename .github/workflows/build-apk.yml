name: Build APK
on:
  push:
    branches: [main, master]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-24.04
    env:
      KS_PASS: ${{ secrets.KS_PASS }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASS: ${{ secrets.KEY_PASS }}
      RUN_NUMBER: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: 17 }
      - run: node scripts/build-www.js
      - run: npm install
      - run: npx cap add android
      - name: Cle de signature
        if: ${{ env.KS_PASS != '' }}
        run: echo "${{ secrets.KS_BASE64 }}" | base64 -d > android/app/release.jks
      - run: python3 scripts/patch_android.py
      - run: npx cap sync android
      - name: APK signe + AAB (Play Store)
        if: ${{ env.KS_PASS != '' }}
        run: cd android && chmod +x gradlew && ./gradlew assembleRelease bundleRelease --no-daemon
      - name: APK de test (sans signature)
        if: ${{ env.KS_PASS == '' }}
        run: cd android && chmod +x gradlew && ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: WEARLY
          path: |
            android/app/build/outputs/apk/release/app-release.apk
            android/app/build/outputs/bundle/release/app-release.aab
            android/app/build/outputs/apk/debug/app-debug.apk
