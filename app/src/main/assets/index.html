<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<title>WEARLY – Teranga</title>
<style>
:root{box-sizing:border-box;--bg:#fbf6ec;--card:#fff;--tx:#1d1a16;--mu:#857d70;--ac:#0b7a43;--ac2:#e0a526;--rd:#d62828;--bd:#eadfca;padding-top:env(safe-area-inset-top,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#13110e;--card:#1e1b16;--tx:#f4efe6;--mu:#a29a8b;--ac:#35b36f;--bd:#2f2a22}}
:root[data-theme="dark"]{--bg:#13110e;--card:#1e1b16;--tx:#f4efe6;--mu:#a29a8b;--ac:#35b36f;--bd:#2f2a22}
*{box-sizing:border-box;margin:0}
html,body{height:100%;overscroll-behavior:none}
body{background:var(--bg);color:var(--tx);font:15px/1.4 system-ui,-apple-system,Roboto,sans-serif;display:flex;flex-direction:column;max-width:480px;margin:auto;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
#main{flex:1;overflow-y:auto;padding:14px 16px 96px;-webkit-overflow-scrolling:touch}
input{-webkit-user-select:text;user-select:text}
.wax{height:10px;border-radius:6px;margin:0 0 12px;background:repeating-linear-gradient(90deg,var(--ac) 0 14px,var(--ac2) 14px 22px,var(--rd) 22px 30px,var(--tx) 30px 33px)}
h1{font-size:23px;font-weight:800;letter-spacing:-.4px}h2{font-size:17px;margin:16px 0 8px}
.mu{color:var(--mu);font-size:13px}.card{background:var(--card);border:1px solid var(--bd);border-radius:20px;padding:14px;margin-bottom:11px}
.row{display:flex;align-items:center;gap:10px}.sp{justify-content:space-between}.wrap{flex-wrap:wrap}
.chip{padding:8px 13px;border-radius:99px;border:1px solid var(--bd);background:var(--card);font-size:13px;cursor:pointer;white-space:nowrap;touch-action:manipulation}.chip.on{background:var(--ac);color:#fff;border-color:var(--ac)}
.scroll{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;-webkit-overflow-scrolling:touch}
.btn{border:0;border-radius:14px;padding:10px 13px;background:var(--ac);color:#fff;font-weight:700;font-size:13px;cursor:pointer;touch-action:manipulation}.btn.o{background:transparent;color:var(--tx);border:1px solid var(--bd)}.btn.g{background:var(--ac2);color:#1d1a16}.btn.r{background:var(--rd)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.it{border-radius:18px;padding:14px 8px;text-align:center;color:#fff;cursor:pointer;touch-action:manipulation}.it .e{font-size:42px;display:block}.it b{font-size:12px}
.sl{display:flex;align-items:center;gap:12px;padding:7px 0;border-bottom:1px solid var(--bd)}.sl:last-child{border:0}
.th{width:54px;height:54px;border-radius:14px;display:grid;place-items:center;font-size:28px;color:#fff;flex:none}
.score{font-size:28px;font-weight:800;color:var(--ac2)}
.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;display:flex;background:var(--card);border-top:1px solid var(--bd);padding:5px 2px calc(5px + env(safe-area-inset-bottom,0px));z-index:8}
.nav div{flex:1;text-align:center;font-size:9.5px;color:var(--mu);cursor:pointer;touch-action:manipulation}.nav div span{font-size:20px;display:block}.nav .on{color:var(--ac);font-weight:800}
.ov{position:fixed;inset:0;background:var(--bg);z-index:9;max-width:480px;margin:auto;overflow-y:auto;padding:calc(14px + env(safe-area-inset-top,0px)) 16px 40px;-webkit-overflow-scrolling:touch}
.bub{max-width:80%;padding:10px 13px;border-radius:18px;margin:6px 0;font-size:14px}.me{background:var(--ac);color:#fff;margin-left:auto;border-bottom-right-radius:4px}.st{background:var(--card);border:1px solid var(--bd);border-bottom-left-radius:4px}
input{width:100%;padding:12px;border-radius:14px;border:1px solid var(--bd);background:var(--card);color:var(--tx);font-size:14px}
.tag{font-size:11px;background:var(--ac2);color:#1d1a16;padding:2px 8px;border-radius:99px;font-weight:800}.tag.on{background:var(--ac);color:#fff}.tag.off{background:var(--rd);color:#fff}
.bar{height:8px;border-radius:9px;background:var(--bd);overflow:hidden}.bar i{display:block;height:100%;background:var(--ac2)}
.vf{height:calc(100vh - 170px);overflow-y:scroll;scroll-snap-type:y mandatory;border-radius:20px;-webkit-overflow-scrolling:touch}
.v{height:100%;scroll-snap-align:start;position:relative;display:flex;flex-direction:column;justify-content:flex-end;padding:16px;color:#fff;border-radius:20px;overflow:hidden}
.v .big{position:absolute;top:18%;left:0;right:0;text-align:center;font-size:110px}
.v .side{position:absolute;right:12px;bottom:140px;display:flex;flex-direction:column;gap:14px;text-align:center;font-size:12px}.v .side div{font-size:26px;cursor:pointer}
.map{height:130px;border-radius:16px;background:linear-gradient(135deg,#cfe8d5,#f3e3b8);position:relative;margin-bottom:10px;overflow:hidden}.map i{position:absolute;font-style:normal;font-size:22px}
.fade{animation:f .3s}@keyframes f{from{opacity:0;transform:translateY(8px)}}
.sw{width:42px;height:24px;border-radius:99px;background:var(--bd);position:relative;cursor:pointer}.sw.on{background:var(--ac)}.sw:after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:.2s}.sw.on:after{left:21px}
#lg{position:fixed;top:calc(4px + env(safe-area-inset-top,0px));right:10px;z-index:30;padding:3px 10px}
</style></head>
<body>
<div id="main"></div><div class="nav" id="nav"></div><div id="ov"></div>
<script>
"use strict";
const $=s=>document.querySelector(s),H=new Date().getHours();
const ACT=[['work','💼','Travail'],['sport','⚽','Sport'],['gym','🏋️','Salle'],['running','🏃','Course'],['casual','🚶','Sortie'],['restaurant','🍽️','Restaurant'],['party','🎉','Fête'],['evening','🌙','Soirée'],['wedding','💍','Mariage'],['meeting','🤝','Réunion'],['travel','✈️','Voyage'],['beach','🏖️','Plage'],['traditional','🥻','Cérémonie traditionnelle']];

{id:8,n:'Baskets blanches',e:'👟',h:'#8d99ae',s:'shoes',o:['casual','sport','gym','running','travel','party']},

{id:10,n:'Grand boubou indigo',e:'🥻',h:'#3b2f8f',s:'top',o:['traditional','wedding']},

{id:12,n:'Montre argentée',e:'⌚',h:'#7a7f87',s:'acc',o:['work','meeting','evening','wedding','party','restaurant','casual']}];
const ST=[
{id:1,n:'Boutique Teranga',l:'Plateau, Dakar',d:1.2,r:4.8,o:9,c:20,e:'🏬',t:'Vêtements',ph:'+221 77 000 00 01',x:30,y:40},
{id:2,n:'Sandaga Sneakers',l:'Sandaga, Dakar',d:2.4,r:4.5,o:10,c:22,e:'👟',t:'Chaussures',ph:'+221 77 000 00 02',x:60,y:25},
{id:3,n:'Atelier Wax & Co',l:'Médina, Dakar',d:2.1,r:4.7,o:8,c:19,e:'🧵',t:'Traditionnel',ph:'+221 77 000 00 03',x:45,y:65},
{id:4,n:'Almadies Sport',l:'Almadies, Dakar',d:7.5,r:4.3,o:11,c:21,e:'⚽',t:'Sport',ph:'+221 77 000 00 04',x:80,y:55},
{id:5,n:'Beauté Ndaw',l:'Mermoz, Dakar',d:4,r:4.6,o:11,c:20,e:'💄',t:'Beauté',ph:'+221 77 000 00 05',x:20,y:70}];
const isO=s=>H>=s.o&&H<s.c;
const P=[
{id:1,n:'Chemise Oxford blanche',e:'👔',h:'#cfc8b8',cat:'Vêtements',sel:[[1,30],[3,27],[2,35]],pr:'-40%',v:94,k:12,why:'Pas de chemise blanche dans votre garde-robe : elle va avec 4 bas et 3 paires de chaussures.'},
{id:2,n:'Mocassins en cuir marron',e:'👞',h:'#6b4423',cat:'Chaussures',sel:[[2,55],[1,59]],pr:'',v:91,k:9,why:'Pas encore de chaussures habillées : vos tenues de travail sont incomplètes.'},
{id:3,n:'Grand boubou en bazin',e:'🥻',h:'#3b2f8f',cat:'Traditionnel',sel:[[3,120],[1,135]],pr:'-10%',v:80,k:6,why:'Pour les mariages et la Tabaski. Ajoute un nouveau look de cérémonie.'},
{id:4,n:'Coupe-vent de running',e:'🧥',h:'#264653',cat:'Sport',sel:[[4,38],[2,41]],pr:'-15%',v:62,k:4,why:'Pratique pour courir face à la mer, pas une priorité.'},
{id:5,n:'Rouge à lèvres terracotta',e:'💄',h:'#b5533c',cat:'Beauté',sel:[[5,14]],pr:'',v:70,k:5,why:'S’accorde avec les tons terre chauds et les accessoires dorés.'},
{id:6,n:'Chemise en wax',e:'👘',h:'#d1495b',cat:'Vêtements',sel:[[3,42],[1,45]],pr:'-20%',v:78,k:6,why:'Un imprimé local audacieux pour les sorties.'}];
const VID=[
{who:'Boutique Teranga',st:1,p:1,e:'👔',h:'linear-gradient(160deg,#0b7a43,#052e1a)',t:'3 façons de porter une chemise blanche sous la chaleur de Dakar',l:'12,4k'},
{who:'Atelier Wax & Co',st:3,p:3,e:'🥻',h:'linear-gradient(160deg,#3b2f8f,#150f40)',t:'Nouvelle collection en bazin, cousue main à la Médina',l:'8,1k'},
{who:'Sandaga Sneakers',st:2,p:2,e:'👟',h:'linear-gradient(160deg,#d62828,#4a0b0b)',t:'Nouveautés, pointures 40 à 45',l:'5,7k'},
{who:'Beauté Ndaw',st:5,p:5,e:'💄',h:'linear-gradient(160deg,#b5533c,#3a1a12)',t:'Tons chauds pour un look de soirée',l:'3,2k'}];
const NEWS=[
['LOCAL','La Dakar Fashion Week annonce ses dates 2026','Dakar Fashion Week (démo)'],
['PAYS','Le marché Sandaga accueille 40 nouveaux ateliers de couture','Wakat Mode (démo)'],
['AFRIQUE','L’ankara et le kenté reviennent sur les podiums de Lagos','Africa Style Daily (démo)'],
['MONDE','Le luxe discret domine encore les collections d’automne','World Fashion Wire (démo)'],
['LOCAL','Boutique Teranga ouvre une seconde boutique aux Almadies','Teranga Info (démo)']];
const TR={City:{c:['Indigo','Sable','Or'],cl:['Chemises en lin','Ensembles en bazin'],sh:['Baskets minimalistes','Claquettes'],b:['Boutique Teranga','Wax & Co'],s:['Chic décontracté','Boubou moderne']},Country:{c:['Indigo','Émeraude'],cl:['Grand boubou','Caftan'],sh:['Babouches'],b:['Atelier Wax & Co'],s:['Élégance cérémonielle']},Africa:{c:['Tons terre','Imprimés wax'],cl:['Ensembles ankara','Dashiki'],sh:['Baskets épaisses'],b:['Lagos Loom','Kente Lab'],s:['Afro-contemporain']},World:{c:['Olive','Jaune beurre'],cl:['Blazers oversize','Cargo'],sh:['Baskets rétro'],b:['Uniqlo','Zara'],s:['Luxe discret','Gorpcore']}};
const WORLD=[['🇸🇳','Sénégal','Boubou','Mariage','Les styles de grand boubou diffèrent selon les communautés wolof, pulaar et sérère. Les tissus et broderies changent selon la région et l’occasion.'],['🇹🇳','Tunisie','Jebba','Cérémonie','La jebba se porte lors des mariages et des fêtes religieuses, souvent avec une chechia.'],['🇲🇦','Maroc','Djellaba','Tradition','Les djellabas varient selon les villes ; le caftan est plus courant pour les célébrations.'],['🇯🇵','Japon','Kimono','Cérémonie','Le type de kimono dépend de l’âge, de la saison et de l’événement.'],['🇮🇳','Inde','Kurta','Festival','Les coupes et broderies du kurta varient fortement selon les États.']];
const S={tab:'home',act:'casual',skip:0,dt:'Nearby',nf:'Open now',pc:'All',tr:'City',nw:'ALL',cart:[],orders:[],hist:[{d:'Hier',a:'Sortie',o:'T-shirt noir + Jean foncé + Baskets blanches'},{d:'Il y a 3 jours',a:'Travail',o:'Chemise claire + Pantalon beige'},{d:'Il y a 15 jours',a:'Mariage',o:'Grand boubou + Babouches'}],chats:{},fol:{},lk:{},nt:{Rain:1,Stores:1,Trends:1,Orders:1,Messages:1},seller:0,sv:'Products',cp:1,prof:{name:'Aymen',style:'Chic décontracté',budget:120}};
const lab={top:'Haut',bottom:'Bas',shoes:'Chaussures',acc:'Accessoire'};
function gen(a,k){const r={};['top','bottom','shoes','acc'].forEach(s=>{const c=W.filter(i=>i.s===s&&i.o.includes(a));if(c.length)r[s]=c[k%c.length]});const miss=['top','bottom','shoes'].filter(s=>!r[s]);return{r,miss,sc:Math.min(98,64+Object.keys(r).length*8+(miss.length?0:4)-(k%3))}}
function outfit(g){return['top','bottom','shoes','acc'].map(s=>{const i=g.r[s];return i?`<div class="sl"><div class="th" style="background:${i.h}">${i.e}</div><div><b>${i.n}</b><div class="mu">${lab[s]}</div></div></div>`:s!=='acc'?`<div class="sl"><div class="th" style="background:var(--bd)">❓</div><div><b>Pièce manquante : ${lab[s]}</b><div class="mu">Rien d’adapté à cette activité</div></div></div>`:''}).join('')}
const sp=id=>ST.find(x=>x.id===id),pr=id=>P.find(x=>x.id===id);
const best=p=>p.sel.slice().sort((a,b)=>a[1]-b[1])[0];
function stc(s){return`<div class="card row" onclick="storeD(${s.id})"><div class="th" style="background:var(--ac)">${s.e}</div><div style="flex:1"><div class="row sp"><b>${s.n}</b><span class="tag ${isO(s)?'on':'off'}">${isO(s)?'OUVERT':'FERMÉ'}</span></div><div class="mu">${s.l} · ${s.d} km · ⭐ ${s.r}<br>${s.o}:00 à ${s.c}:00</div></div></div>`}
function pc(p){const b=best(p);return`<div class="card row" onclick="prodD(${p.id})"><div class="th" style="background:${p.h};width:70px;height:70px;font-size:36px">${p.e}</div><div style="flex:1"><div class="row sp"><b>${p.n}</b>${p.pr?`<span class="tag">${p.pr}</span>`:''}</div><div class="mu">chez ${sp(b[0]).n}</div><div class="row sp"><b>€${b[1]}</b><span class="mu">Valeur ${p.v}/100</span></div></div></div>`}
const sec=(n,a)=>`<h2>${n}</h2><div class="row wrap">${a.map(x=>`<span class="chip">${x}</span>`).join('')}</div>`;
const V={
home(){const g=gen(S.act,S.skip),w=H<12?'Bonjour':H<18?'Bon après-midi':'Bonsoir',a=ACT.find(a=>a[0]===S.act);return`<div class="fade"><div class="wax"></div><h1>${w} ${S.prof.name} 👋</h1><div class="mu">Teranga : quand l’hospitalité rencontre le style</div>
<div class="card" style="margin-top:12px;background:linear-gradient(135deg,var(--ac),#064d2a);color:#fff;border:0"><div class="row sp"><b style="font-size:32px">30°C</b><div style="text-align:right">📍 Dakar · ☀️ Ensoleillé<br><span style="opacity:.8;font-size:12px">Humidité 62 % · Vent 14 km/h</span></div></div><div style="font-size:13px;margin-top:6px;opacity:.9">Prévisions : ensoleillé toute la journée, légère brise marine à 18h00.</div></div>
<div class="row sp"><h2>${a[1]} ${a[2]}</h2><span class="mu" onclick="S.tab='ai';go()">Modifier ›</span></div>
<div class="card"><div class="score">${g.sc}% COMPATIBLE</div>${outfit(g)}<div class="mu" style="margin:6px 0">Tissus légers pour 30°C, et votre historique : cette tenue n’a pas été portée ces 3 derniers jours.</div><div class="row wrap"><button class="btn o" onclick="S.lk[S.act+S.skip]=1;go()">${S.lk[S.act+S.skip]?'❤️ AIMÉ':'J’AIME'}</button><button class="btn o" onclick="S.skip++;go()">CHANGER</button><button class="btn o" onclick="toast('Enregistré')">ENREGISTRER</button><button class="btn g" onclick="S.tab='shop';go()">ACHETER LA PIÈCE MANQUANTE</button></div></div>
<h2>Ouvert près de vous</h2>${ST.filter(isO).slice(0,2).map(stc).join('')||'<div class="mu">Aucune boutique ouverte en ce moment.</div>'}
<h2>Tendances à Dakar</h2><div class="row wrap">${TR.City.cl.concat(TR.City.c).map(x=>`<span class="chip">${x}</span>`).join('')}</div>
<h2>Produits recommandés</h2>${P.slice(0,2).map(pc).join('')}<h2>Actualités locales</h2><div class="card"><span class="tag">${NEWS[0][0]}</span> <b>${NEWS[0][1]}</b><div class="mu">${NEWS[0][2]}</div></div></div>`},
wardrobe(){return`<div class="fade"><div class="wax"></div><div class="row sp"><h1>Garde-robe</h1><button class="btn" onclick="add()">+ AJOUTER</button></div><div class="grid" style="margin-top:12px">${W.map(i=>`<div class="it" style="background:${i.h}"><span class="e">${i.e}</span><b>${i.n}</b></div>`).join('')}</div></div>`},
ai(){const g=gen(S.act,S.skip);return`<div class="fade"><div class="wax"></div><h1>✨ Styliste IA</h1><div class="scroll" style="margin:10px 0">${ACT.map(a=>`<div class="chip ${S.act===a[0]?'on':''}" onclick="S.act='${a[0]}';S.skip=0;go()">${a[1]} ${a[2]}</div>`).join('')}</div>
<div class="card"><div class="score">${g.sc}% COMPATIBLE</div>${outfit(g)}<div class="mu">Utilise votre garde-robe, la météo, l’historique et les tendances locales.</div>${g.miss.length?`<div style="margin-top:8px"><b>Il vous faut ${g.miss.map(m=>lab[m].toLowerCase()).join(' et ')} pour compléter cette tenue.</b><br><button class="btn g" style="margin-top:6px" onclick="S.tab='shop';go()">TROUVER</button></div>`:''}<div class="row" style="margin-top:8px"><button class="btn o" onclick="S.skip++;go()">🔄 Régénérer</button><button class="btn" onclick="wear()">Porter aujourd’hui</button></div></div>
<div class="card"><b>💄 Accord beauté</b><div class="mu">Rouge à lèvres terracotta + accessoires dorés complètent ce look. (Simple suggestion cosmétique)</div><button class="btn o" style="margin-top:6px" onclick="prodD(5)">Voir le produit</button></div>
<div class="card"><b>⚽ Mode sport</b><div class="mu">Football, basket, course, salle, tennis, cyclisme, natation : tenue légère et respirante conseillée à 30°C.</div></div></div>`},
shop(){const cats=['All','Vêtements','Chaussures','Sport','Traditionnel','Beauté'];return`<div class="fade"><div class="wax"></div><div class="row sp"><h1>🛍️ Shop</h1><button class="btn o" onclick="cartV()">🛒 ${S.cart.length}</button></div><input placeholder="Rechercher un produit" oninput="q(this.value)" style="margin:10px 0"><div class="scroll">${cats.map(c=>`<div class="chip ${S.pc===c?'on':''}" onclick="S.pc='${c}';go()">${c}</div>`).join('')}</div>
<div class="mu" style="margin:6px 0">Recommandations basées sur votre garde-robe. Les contenus sponsorisés sont signalés.</div><div id="pl">${P.filter(p=>S.pc==='All'||p.cat===S.pc).sort((a,b)=>b.v-a.v).map(pc).join('')}</div></div>`},
videos(){return`<div class="fade"><div class="vf">${VID.map((v,i)=>`<div class="v" style="background:${v.h}"><div class="big">${v.e}</div><div class="side"><div onclick="S.lk['v${i}']=1;toast('Aimé')">❤️<br><small>${v.l}</small></div><div onclick="toast('Commentaires (démo)')">💬</div><div onclick="toast('Partagé')">↗️</div><div onclick="toast('Enregistré')">🔖</div></div><b>@${v.who.replace(/ /g,'')}</b><div style="font-size:13px;margin:4px 0 10px;max-width:78%">${v.t}</div><div class="row wrap" style="max-width:80%"><button class="btn g" onclick="prodD(${v.p})">VOIR LE PRODUIT</button><button class="btn o" style="color:#fff;border-color:#fff8" onclick="storeD(${v.st})">VOIR LA BOUTIQUE</button><button class="btn o" style="color:#fff;border-color:#fff8" onclick="chat(${v.st},${v.p})">MESSAGE</button><button class="btn o" style="color:#fff;border-color:#fff8" onclick="S.fol[${v.st}]=1;toast('Abonnement activé')">${S.fol[v.st]?'Abonné':'SUIVRE'}</button></div></div>`).join('')}</div></div>`},
discover(){const t=['Nearby','Trends','News','World'];let b='';
if(S.dt==='Nearby'){const f=S.nf,l=ST.filter(s=>f==='Open now'?isO(s):f==='Within 5 km'?s.d<=5:s.t===f);b=`<div class="map">${ST.map(s=>`<i style="left:${s.x}%;top:${s.y}%">📍</i>`).join('')}<i style="left:48%;top:48%">🔵</i></div><div class="scroll">${['Open now','Within 5 km','Vêtements','Chaussures','Sport','Traditionnel'].map(c=>`<div class="chip ${f===c?'on':''}" onclick="S.nf='${c}';go()">${c}</div>`).join('')}</div>${l.map(stc).join('')||'<div class="mu">Aucune boutique.</div>'}<div class="mu">Horaires de démonstration. En production, le statut vient d’une API de cartes/commerces ou du vendeur.</div>`}
else if(S.dt==='Trends'){const x=TR[S.tr];b=`<div class="scroll">${Object.keys(TR).map(k=>`<div class="chip ${S.tr===k?'on':''}" onclick="S.tr='${k}';go()">${{City:'Tendances à Dakar',Country:'Sénégal',Africa:'Afrique',World:'Dans le monde'}[k]}</div>`).join('')}</div><div class="mu">Données agrégées et anonymes.</div>${sec('Vêtements',x.cl)}${sec('Couleurs',x.c)}${sec('Chaussures',x.sh)}${sec('Marques',x.b)}${sec('Styles',x.s)}`}
else if(S.dt==='News'){b=`<div class="scroll">${['ALL','LOCAL','PAYS','AFRIQUE','MONDE'].map(c=>`<div class="chip ${S.nw===c?'on':''}" onclick="S.nw='${c}';go()">${c}</div>`).join('')}</div>${NEWS.filter(n=>S.nw==='ALL'||n[0]===S.nw).map(n=>`<div class="card"><span class="tag">${n[0]}</span> <b>${n[1]}</b><div class="mu">Source : ${n[2]}</div></div>`).join('')}`}
else b=`<div class="mu">Pays → Culture → Occasion</div>${WORLD.map(w=>`<div class="card" onclick="ov('<h1>${w[0]} ${w[1]}</h1><h2>${w[2]} → ${w[3]}</h2><div class=card>${w[4]}</div>')"><b>${w[0]} ${w[1]}</b> → ${w[2]} → ${w[3]}</div>`).join('')}`;
return`<div class="fade"><div class="wax"></div><h1>Explorer</h1><div class="scroll" style="margin:10px 0">${t.map(x=>`<div class="chip ${S.dt===x?'on':''}" onclick="S.dt='${x}';go()">${x}</div>`).join('')}</div>${b}</div>`},
msg(){return`<div class="fade"><div class="wax"></div><h1>💬 Messages</h1><div style="margin-top:10px">${ST.map(s=>`<div class="card row" onclick="chat(${s.id})"><div class="th" style="background:var(--ac)">${s.e}</div><div><b>${s.n}</b><div class="mu">${(S.chats[s.id]||[]).slice(-1).map(m=>m.t||'Offre €'+m.o)[0]||'Démarrer une conversation'}</div></div></div>`).join('')}<div class="card row"><div class="th" style="background:var(--ac2)">👥</div><div><b>Fatou (amie)</b><div class="mu">Tenue partagée · Abonnés uniquement</div></div></div></div></div>`},
profile(){if(S.seller)return seller();const p=S.prof;return`<div class="fade"><div class="wax"></div><div class="row"><div class="th" style="background:var(--ac);border-radius:50%;width:64px;height:64px">${p.name[0]}</div><div><h1>${p.name}</h1><div class="mu">📍 Dakar · ${p.style} · Budget €${p.budget}/mois</div></div></div>
<button class="btn g" style="margin:12px 0;width:100%" onclick="S.seller=1;go()">🏪 Passer au tableau de bord vendeur</button>
<h2>Commandes</h2>${S.orders.map(o=>`<div class="card"><div class="row sp"><b>${o.n}</b><span class="tag">${o.s}</span></div><div class="mu">${sp(o.st).n} · €${o.p} + €3 livraison = <b>€${o.p+3}</b></div><div class="row wrap" style="margin-top:6px">${['En attente','Confirmée','En préparation','Expédiée','Livrée'].map((x,i)=>`<span class="chip ${i<=o.i?'on':''}" style="font-size:10px;padding:4px 8px">${x}</span>`).join('')}</div><button class="btn o" style="margin-top:6px" onclick="adv(${o.id})">Démo : statut suivant</button></div>`).join('')||'<div class="card mu">Aucune commande.</div>'}
<h2>Historique des tenues</h2><div class="card">${S.hist.map(h=>`<div class="sl"><div><b>Dernier port : ${h.d}</b> · ${h.a}<div class="mu">${h.o}</div></div></div>`).join('')}</div>
<h2>Notifications</h2><div class="card">${Object.keys(S.nt).map(k=>`<div class="row sp sl"><span>${k}</span><div class="sw ${S.nt[k]?'on':''}" onclick="S.nt['${k}']=!S.nt['${k}'];go()"></div></div>`).join('')}</div>
<div class="card"><b>Confidentialité</b><div class="mu">Profil : Public / Abonnés / Privé. La personnalisation peut être désactivée.</div></div><button class="btn o" onclick="document.documentElement.dataset.theme=document.documentElement.dataset.theme==='dark'?'light':'dark'">🌓 Thème</button></div>`}};
function seller(){const t=['Products','Orders','Messages','Videos','Promotions','Analytics','Settings'];let b='';
if(S.sv==='Products')b=P.slice(0,4).map(p=>`<div class="card row sp"><b>${p.e} ${p.n}</b><span class="mu">Stock ${10+p.id*3}</span></div>`).join('')+'<button class="btn" onclick="toast('Ajout de produit (démo)')">+ Ajouter un produit</button>';
else if(S.sv==='Orders')b=(S.orders.length?S.orders:[{n:'Chemise Oxford blanche',p:30,s:'En attente'}]).map(o=>`<div class="card"><b>${o.n}</b> <span class="tag">${o.s}</span><div class="row" style="margin-top:6px"><button class="btn" onclick="toast('Confirmée')">Confirmer</button><button class="btn r" onclick="toast('Annulée')">Annuler</button></div></div>`).join('');
else if(S.sv==='Analytics')b=`<div class="grid"><div class="card"><div class="score">1 284</div><div class="mu">Vues boutique</div></div><div class="card"><div class="score">37</div><div class="mu">Commandes</div></div><div class="card"><div class="score">9,2k</div><div class="mu">Vues vidéos</div></div><div class="card"><div class="score">€1 640</div><div class="mu">Chiffre d’affaires</div></div></div>`;
else if(S.sv==='Settings')b=`<div class="card"><b>Boutique Teranga</b><div class="mu">Horaires 9:00 à 20:00 · alimentent le statut OUVERT</div></div>`;
else b=`<div class="card mu">${S.sv} : section de démonstration. Reliée à de vraies données en production.</div>`;
return`<div class="fade"><div class="wax"></div><div class="row sp"><h1>🏪 Vendeur</h1><button class="btn o" onclick="S.seller=0;go()">Quitter</button></div><div class="scroll" style="margin:10px 0">${t.map(x=>`<div class="chip ${S.sv===x?'on':''}" onclick="S.sv='${x}';go()">${x.toUpperCase()}</div>`).join('')}</div>${b}</div>`}
const tabs=[['home','🏠','Accueil'],['discover','🧭','Explorer'],['ai','✨','Styliste'],['shop','🛍️','Shop'],['videos','🎬','Vidéos'],['msg','💬','Messages'],['profile','👤','Profil']];
function go(){$('#main').innerHTML=V[S.tab]();$('#nav').innerHTML=tabs.map(t=>`<div class="${S.tab===t[0]?'on':''}" onclick="S.tab='${t[0]}';go();$('#main').scrollTo(0,0)"><span>${t[1]}</span>${t[2]}</div>`).join('')}
function ov(h){$('#ov').innerHTML=h?`<div class="ov fade"><div onclick="ov()" style="cursor:pointer;margin-bottom:10px">‹ Retour</div>${h}</div>`:''}
function toast(t){const d=document.createElement('div');d.textContent=t;d.style.cssText='position:fixed;bottom:90px;left:50%;transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:10px 16px;border-radius:99px;z-index:99;font-size:13px;max-width:90%;text-align:center';document.body.appendChild(d);setTimeout(()=>d.remove(),1300)}
function q(v){$('#pl').innerHTML=P.filter(p=>p.n.toLowerCase().includes(v.toLowerCase())).map(pc).join('')||'<div class="mu">Aucun résultat</div>'}
function prodD(id){const p=pr(id),bp=best(p),near=p.sel.slice().sort((a,b)=>sp(a[0]).d-sp(b[0]).d)[0],rt=p.sel.slice().sort((a,b)=>sp(b[0]).r-sp(a[0]).r)[0];
ov(`<div class="th" style="background:${p.h};width:100%;height:200px;font-size:96px;border-radius:24px">${p.e}</div><h1 style="margin-top:10px">${p.n}</h1><div class="mu">Photos · Vidéo · Tailles S M L XL · Livraison 3 € à Dakar ou retrait</div>
<div class="card" style="margin-top:8px"><div class="row sp"><b>VALEUR GARDE-ROBE</b><span class="score" style="font-size:22px">${p.v}/100</span></div><div class="bar"><i style="width:${p.v}%"></i></div><div class="mu" style="margin-top:6px">${p.why} Crée <b>${p.k} nouvelles tenues</b>.</div></div>
<h2>Comparer les vendeurs</h2>${p.sel.map(([s,pc2])=>{const st=sp(s);return`<div class="card row sp"><div onclick="storeD(${s})"><b>${st.n}</b> ${s===bp[0]?'<span class="tag">MEILLEUR PRIX</span>':''} ${s===near[0]?'<span class="tag on">LE PLUS PROCHE</span>':''} ${s===rt[0]?'<span class="tag" style="background:var(--rd);color:#fff">MIEUX NOTÉ</span>':''}<div class="mu">${st.d} km · ⭐ ${st.r} · ${isO(st)?'Ouvert':'Fermé'}</div></div><b>€${pc2}</b></div>`}).join('')}
<div class="row wrap"><button class="btn" onclick="S.cart.push(${id});toast('Ajouté au panier');ov()">AJOUTER AU PANIER</button><button class="btn g" onclick="order(${id},${bp[1]},${bp[0]})">ACHETER</button><button class="btn o" onclick="chat(${bp[0]},${id})">MESSAGE VENDEUR</button><button class="btn o" onclick="chat(${bp[0]},${id},1)">FAIRE UNE OFFRE</button></div>`)}
function storeD(id){const s=sp(id);ov(`<div class="row"><div class="th" style="background:var(--ac);width:70px;height:70px;font-size:36px">${s.e}</div><div><h1>${s.n}</h1><div class="mu">${s.l} · ⭐ ${s.r}</div></div></div><div class="card" style="margin-top:10px"><span class="tag ${isO(s)?'on':'off'}">${isO(s)?'OUVERT':'FERMÉ'}</span> ${s.o}:00 à ${s.c}:00<br><span class="mu">📞 ${s.ph}</span></div><div class="row"><button class="btn" onclick="chat(${id})">💬 Message</button><button class="btn o" onclick="S.fol[${id}]=1;toast('Abonnement activé')">Suivre</button></div><h2>Produits</h2>${P.filter(p=>p.sel.some(x=>x[0]===id)).map(pc).join('')}`)}
function cartV(){ov(`<h1>🛒 Panier</h1>${S.cart.map(i=>`<div class="card row sp"><b>${pr(i).n}</b><span>€${best(pr(i))[1]}</span></div>`).join('')||'<div class="mu">Panier vide.</div>'}${S.cart.length?`<button class="btn g" style="width:100%" onclick="S.cart.forEach(i=>order(i,best(pr(i))[1],best(pr(i))[0],1));S.cart=[];ov();S.tab='profile';go()">Valider (démo, sans paiement)</button>`:''}`)}
function order(pid,price,sid,q){S.orders.unshift({id:Date.now()+pid,n:pr(pid).n,p:price,st:sid,s:'En attente',i:0});if(!q){ov(`<h1>Commande passée ✅</h1><div class="card">${pr(pid).n} : €${price}<br>Livraison 3 €<br><b>Total €${price+3}</b><div class="mu">Démo uniquement. Suivez-la dans Profil.</div></div><button class="btn" onclick="ov();S.tab='profile';go()">Voir les commandes</button>`)}}
function adv(id){const o=S.orders.find(x=>x.id===id),L=['En attente','Confirmée','En préparation','Expédiée','Livrée'];if(o.i<4){o.i++;o.s=L[o.i]}go()}
function chat(id,pid,off){const c=S.chats[id]=S.chats[id]||[{f:'st',t:'Teranga ! Comment pouvons-nous vous aider ?'}];if(pid&&!c.some(m=>m.pid===pid))c.push({f:'me',t:'Ce produit est-il disponible aujourd’hui : '+pr(pid).n+' ?',pid},{f:'st',t:'Oui, disponible. Quelle taille ?'});S.cp=pid||S.cp||1;rc(id);if(off)setTimeout(()=>snd(id,'Pouvez-vous faire un meilleur prix ?'),300)}
function rc(id){const c=S.chats[id],s=sp(id);ov(`<div class="row"><div class="th" style="background:var(--ac)">${s.e}</div><div><h1>${s.n}</h1><div class="mu">Lié à : ${pr(S.cp).n}</div></div></div><div style="margin:12px 0">${c.map((m,i)=>m.o?`<div class="card"><b>Offre : €${m.o}</b>${m.ok===undefined?`<div class="row" style="margin-top:6px"><button class="btn g" onclick="S.chats[${id}][${i}].ok=1;rc(${id})">ACCEPTER L’OFFRE</button><button class="btn r" onclick="S.chats[${id}][${i}].ok=0;rc(${id})">REFUSER L’OFFRE</button></div>`:m.ok?`<span class="tag on">ACCEPTÉE</span> <button class="btn" onclick="order(S.cp,${m.o},${id})">COMMANDER</button>`:'<span class="tag off">REFUSÉE</span>'}</div>`:`<div class="bub ${m.f}">${m.t}</div>`).join('')}</div><div class="scroll" style="margin-bottom:8px">${['Avez-vous la taille L ?','Pouvez-vous baisser le prix ?','Une autre photo, s’il vous plaît','Livrez-vous ?'].map(t=>`<div class="chip" onclick="snd(${id},'${t}')">${t}</div>`).join('')}<div class="chip" onclick="snd(${id},'ENVOYER UNE OFFRE DE €25')">ENVOYER UNE OFFRE DE €25</div></div>`)}
function snd(id,t){const c=S.chats[id];c.push({f:'me',t});rc(id);setTimeout(()=>{if(/offre|prix|baisser|meilleur/i.test(t))c.push({f:'st',t:'Je peux faire un petit effort : '},{o:Math.round(best(pr(S.cp))[1]*.9)});else if(/taille/i.test(t))c.push({f:'st',t:'Oui, la taille L est en stock.'});else if(/livr/i.test(t))c.push({f:'st',t:'Livraison à Dakar : 3 €, sous 24 h.'});else c.push({f:'st',t:'J’envoie une nouvelle photo 📷'});rc(id)},700)}
function add(){ov(`<h1>Ajouter un vêtement</h1><div class="card" style="text-align:center;padding:36px 10px"><div style="font-size:56px">📸</div><button class="btn" onclick="ov('<h1>Détecté ✅</h1><div class=card>Chemise · Blanche · Classique · Coton · Toutes saisons · Travail, Réunion</div><button class=btn onclick=&quot;W.push({id:99,n:\\'Chemise blanche\\',e:\\'👔\\',h:\\'#b8b4ab\\',s:\\'top\\',o:[\\'work\\',\\'meeting\\',\\'restaurant\\',\\'evening\\',\\'wedding\\']});ov();go()&quot;>Enregistrer (modifiable)</button>')">Prendre une photo (démo)</button></div>`)}
function wear(){const g=gen(S.act,S.skip);S.hist.unshift({d:'Aujourd’hui',a:ACT.find(a=>a[0]===S.act)[2],o:Object.values(g.r).map(i=>i.n).join(' + ')});toast('Ajouté à l’historique')}
go();
window.addEventListener('error',e=>console.error('WEARLY:',e.message));
</script></body></html>
